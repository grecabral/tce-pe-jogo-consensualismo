<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexo Climático: Atmosfera Dinâmica</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050a1a; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; z-index: 10; width: 100%; }
        .stats-row { display: flex; justify-content: space-around; width: 100%; margin-bottom: 10px; }
        .stat-group { background: rgba(0, 20, 40, 0.8); padding: 10px 20px; border: 1px solid #00d4ff; border-radius: 8px; font-size: 0.9em; }
        
        /* Barra de Tendência */
        #nexo-bar-container { width: 200px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        #nexo-pointer { width: 50%; height: 100%; background: linear-gradient(90deg, #00d4ff, #ffcc00); transition: width 0.5s ease; }
        
        #timer-box { font-size: 2em; color: #fff; text-shadow: 0 0 15px #00d4ff; margin: 5px 0; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,5,15,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 100; padding: 25px; }
        #results, #mode-selection { display: none; }
        .btn { background: #00d4ff; color: #000; border: none; padding: 18px 45px; cursor: pointer; font-size: 1.3em; font-weight: bold; border-radius: 60px; margin: 10px; transition: 0.3s; }
        .btn:hover { background: #fff; transform: scale(1.05); }
        .btn-hardcore { background: #ff4444; color: #fff; }
        .btn-relax { background: #44ff88; color: #000; }
        
        .badge { width: 80px; height: 80px; margin: 15px auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 4px solid; }
        .badge-1 { background: #444; border-color: #888; }
        .badge-2 { background: #004e64; border-color: #00d4ff; }
        .badge-3 { background: #9a8412; border-color: #ffcc00; }
        canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stats-row">
        <div class="stat-group">PONTOS: <span id="score">0</span></div>
        <div id="timer-box"><span id="timer">45</span>s</div>
        <div class="stat-group">💧 <span id="dark-c">0</span> | ☀️ <span id="light-c">0</span></div>
    </div>
    <div style="font-size: 0.7em; margin-bottom: 4px; letter-spacing: 2px;">TENDÊNCIA DO NEXO</div>
    <div id="nexo-bar-container">
        <div id="nexo-pointer"></div>
    </div>
</div>

<div id="overlay">
    <div id="start-screen">
        <h1 style="color:#00d4ff;">BEM-VINDO, OBSERVADOR</h1>
        <p>Sua vontade molda a luz e a escuridão do amanhã.</p>
        <button class="btn" id="goNextBtn">CONFIGURAR NEXO</button>
    </div>
    <div id="mode-selection">
        <h2 style="color:#00d4ff;">ESCOLHA A INTENSIDADE</h2>
        <button class="btn btn-relax" onclick="startGame('relax')">RELAXANTE</button>
        <button class="btn btn-hardcore" onclick="startGame('hardcore')">HARDCORE</button>
    </div>
    <div id="results">
        <h1 id="rank-title" style="color:#00d4ff;">CARGO ALCANÇADO</h1>
        <div id="badge-icon"></div>
        <div id="weather-report"></div>
        <button class="btn" onclick="location.reload()">RECALIBRAR</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let gameActive = false, score = 0, chuvosoCount = 0, firmeCount = 0, timeLeft = 45;
let playerX = window.innerWidth / 2, items = [], feedbacks = [], animationId;
let gameConfig = {};
let climateBias = 0.5; // 0 = Chuva total, 1 = Sol total

const imgs = { moon: new Image(), rain: new Image(), star: new Image(), bolt: new Image() };
imgs.moon.src = 'crescent-moon.png'; imgs.rain.src = 'heavy-rain.png';
imgs.star.src = 'star.png'; imgs.bolt.src = 'thunder.png';

window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
canvas.width = window.innerWidth; canvas.height = window.innerHeight;

function updatePos(x) { const r = canvas.getBoundingClientRect(); playerX = x - r.left; }
canvas.addEventListener('mousemove', (e) => updatePos(e.clientX));
canvas.addEventListener('touchmove', (e) => { updatePos(e.touches[0].clientX); e.preventDefault(); }, { passive: false });

function playSfx(type) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type === 'win' ? 'sine' : (type === 'big-win' ? 'square' : 'sawtooth');
    o.frequency.setValueAtTime(type === 'win' ? 850 : (type === 'big-win' ? 1000 : 90), audioCtx.currentTime);
    g.gain.setValueAtTime(0.04, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.1);
}

class Item {
    constructor(type) {
        this.type = type;
        this.isSpecial = Math.random() < gameConfig.specialChance;
        this.x = Math.random() * (canvas.width - 100) + 50;
        this.y = -50;
        const progress = (45 - timeLeft) / 45; 
        const baseSpeed = (gameConfig.speedBase + (progress * gameConfig.speedProg));
        this.speed = this.isSpecial ? baseSpeed * 1.8 : baseSpeed + Math.random() * 2;
        this.img = (this.type === 'chuvoso') ? (Math.random() > 0.5 ? imgs.bolt : imgs.rain) : (Math.random() > 0.5 ? imgs.star : imgs.moon);
    }
    draw() {
        if(this.isSpecial) { ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = this.type === 'chuvoso' ? "#00d4ff" : "#ffcc00"; }
        ctx.drawImage(this.img, this.x - 25, this.y - 25, 50, 50);
        if(this.isSpecial) ctx.restore();
    }
}

function spawnPair() {
    if (!gameActive) return;
    items.push(new Item('chuvoso')); items.push(new Item('firme'));
    const progress = (45 - timeLeft) / 45;
    const interval = Math.max(gameConfig.spawnMin, gameConfig.spawnRate - (progress * gameConfig.spawnProg));
    setTimeout(spawnPair, interval);
}

// Função para converter o Bias em cor (Azul Marinho Escuro -> Azul Profundo Claro)
function getBgColor() {
    const r = Math.floor(2 + (climateBias * 15));
    const g = Math.floor(5 + (climateBias * 45));
    const b = Math.floor(13 + (climateBias * 70));
    return `rgb(${r}, ${g}, ${b})`;
}

function update() {
    if (!gameActive) return;

    // Fundo Dinâmico baseado na escolha do jogador
    ctx.fillStyle = getBgColor(); 
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const bY = canvas.height - 140;
    drawSaco(playerX - 75, bY, "#00d4ff", "CHUVA");
    drawSaco(playerX + 75, bY, "#ffcc00", "SOL");

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i]; it.y += it.speed; it.draw();
        
        if (it.y > canvas.height) { 
            score -= 2; items.splice(i, 1); 
        } else if (it.y > bY && it.y < bY + 65) {
            const dL = Math.abs(it.x - (playerX - 75)), dR = Math.abs(it.x - (playerX + 75));
            if (dL < 50 || dR < 50) {
                const capturedLeft = dL < dR;
                const hit = (capturedLeft && it.type === 'chuvoso') || (!capturedLeft && it.type === 'firme');
                
                let pts = hit ? (it.isSpecial ? 40 : 20) : (it.isSpecial ? -40 : -10);
                score += pts; 

                if(hit) {
                    it.type === 'chuvoso' ? chuvosoCount++ : firmeCount++;
                    // Ajusta o Bias Climático: Itens Firme aumentam (claro), Itens Chuva diminuem (escuro)
                    climateBias = Math.max(0, Math.min(1, climateBias + (it.type === 'firme' ? 0.05 : -0.05)));
                }

                playSfx(hit ? (it.isSpecial ? 'big-win' : 'win') : 'loss');
                feedbacks.push({x: it.x, y: it.y, t: (pts > 0 ? "+" : "") + pts, c: pts > 0 ? "#0f0" : "#f00", a: 1, s: it.isSpecial ? 50 : 35});
                items.splice(i, 1);
            }
        }
    }

    // Atualiza Barra HUD
    document.getElementById('nexo-pointer').style.width = (climateBias * 100) + "%";
    
    feedbacks.forEach((f, i) => { 
        ctx.save(); ctx.globalAlpha = f.a; ctx.fillStyle = f.c; ctx.font = `bold ${f.s}px Courier New`; 
        ctx.textAlign = "center"; ctx.fillText(f.t, f.x, f.y); ctx.restore(); 
        f.y -= 2.5; f.a -= 0.03; if(f.a <= 0) feedbacks.splice(i, 1); 
    });

    document.getElementById('score').innerText = score;
    document.getElementById('dark-c').innerText = chuvosoCount;
    document.getElementById('light-c').innerText = firmeCount;
    animationId = requestAnimationFrame(update);
}

function drawSaco(x, y, color, label) {
    ctx.strokeStyle = color; ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x-40, y); ctx.lineTo(x+40, y); ctx.bezierCurveTo(x+55, y+75, x-55, y+75, x-40, y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 12px Courier"; ctx.textAlign = "center"; ctx.fillText(label, x, y + 50);
}

document.getElementById('goNextBtn').addEventListener('click', () => {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('mode-selection').style.display = 'block';
});

function startGame(mode) {
    if(mode === 'relax') {
        gameConfig = { speedBase: 3, speedProg: 4, spawnRate: 1200, spawnMin: 600, spawnProg: 500, specialChance: 0.1 };
    } else {
        gameConfig = { speedBase: 6, speedProg: 10, spawnRate: 800, spawnMin: 300, spawnProg: 600, specialChance: 0.35 };
    }
    gameActive = true; document.getElementById('overlay').style.display = 'none';
    spawnPair(); update();
    const tInt = setInterval(() => {
        timeLeft--; document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) { clearInterval(tInt); gameActive = false; cancelAnimationFrame(animationId); showFinal(); }
    }, 1000);
}

function showFinal() {
    document.getElementById('overlay').style.display = 'flex';
    document.getElementById('mode-selection').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    const finalWeather = chuvosoCount > firmeCount ? "CHUVOSO" : "TEMPO FIRME";
    let rank = score < 500 ? "INICIANTE" : (score < 1200 ? "ESPECIALISTA" : "DIVINDADE");
    document.getElementById('rank-title').innerText = rank;
    document.getElementById('badge-icon').innerHTML = `<div class="badge ${score < 500 ? 'badge-1' : (score < 1200 ? 'badge-2' : 'badge-3')}">${score < 500 ? '☁️' : (score < 1200 ? '🛰️' : '🌟')}</div>`;
    document.getElementById('weather-report').innerHTML = `<h2 style="font-size: 1.8em;">PONTOS: ${score}</h2><p>PREVISÃO: ${finalWeather}</p>`;
}
</script>
</body>
</html>
