<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Hospital do Consenso: Point & Click</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        
        #game-window { 
            position: relative; 
            width: 1024px; /* Ajuste para a largura da sua imagem se necessário */
            height: 683px; /* Ajuste para a altura da sua imagem se necessário */
            border: 4px solid #333; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            background-image: url('hospital.png'); /* O NOME DO ARQUIVO DEVE SER EXATO */
            background-size: cover;
            background-position: center;
        }

        /* Áreas Clicáveis (Hotspots) - Invisíveis por padrão */
        .hotspot { 
            position: absolute; 
            cursor: pointer; 
            background: rgba(0, 210, 255, 0.0); /* Mude para 0.2 para ver as áreas ao testar */
            border-radius: 5px;
            transition: 0.3s;
            z-index: 10;
        }
        
        /* Brilho ao passar o mouse para dar feedback */
        .hotspot:hover { 
            background: rgba(0, 210, 255, 0.2); 
            box-shadow: 0 0 15px #00d2ff; 
        }

        /* Definição dos itens baseado na imagem brasileira fornecida */
        /* Item 1: Prancheta no Leito A-1 (Acordo) */
        #item-acordo { 
            top: 76%; 
            left: 35%; 
            width: 70px; 
            height: 70px; 
        }
        
        /* Item 2: Monitor/Equipamento no Alto (Escuta Ativa) */
        #item-escuta { 
            top: 21%; 
            left: 63%; 
            width: 70px; 
            height: 70px; 
        }
        
        /* Item 3: Caixa de Medicamentos no Canto Inferior Direito (Equilíbrio) */
        #item-equilibrio { 
            top: 78%; 
            left: 77%; 
            width: 90px; 
            height: 90px; 
        }

        /* Inventário na parte inferior */
        #inventory { 
            width: 1024px; 
            background: #1a1a1a; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            border-top: 3px solid #00d2ff; 
            position: absolute; 
            bottom: 0; 
            left: 50%; 
            transform: translateX(-50%); 
        }
        
        .inv-slot { 
            width: 220px; 
            padding: 10px; 
            border: 2px dashed #444; 
            text-align: center; 
            font-size: 14px; 
            color: #888; 
            transition: 0.5s;
        }
        
        .inv-slot.found { 
            border: 2px solid #00ff88; 
            background: rgba(0, 255, 136, 0.1); 
            color: #00ff88; 
            font-weight: bold;
        }

        /* Caixa de Mensagem Narrativa */
        #msg-box { 
            position: absolute; 
            bottom: 120px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0,0,0,0.9); 
            color: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #00d2ff;
            display: none; 
            text-align: center; 
            width: 70%; 
            pointer-events: none; 
            z-index: 100;
        }
        
    </style>
</head>
<body>

    <div id="game-window">
        <div id="item-acordo" class="hotspot" title="Investigar Prontuário" onclick="coletar('acordo', 'Acordo de Vontades', 'O prontuário mostra que paciente e médico decidiram juntos o tratamento. Consenso alcançado!')"></div>
        <div id="item-escuta" class="hotspot" title="Investigar Monitor" onclick="coletar('escuta', 'Escuta Ativa', 'O monitor registrou que todas as queixas e medos do paciente foram ouvidos com atenção.')"></div>
        <div id="item-equilibrio" class="hotspot" title="Investigar Caixa" onclick="coletar('equilibrio', 'Equilíbrio', 'Esta caixa de medicamentos equilibra o custo do hospital com o bem-estar do paciente.')"></div>
        
        <div id="msg-box"></div>
    </div>

    <div id="inventory">
        <div id="slot-acordo" class="inv-slot">? EVIDÊNCIA 1</div>
        <div id="slot-escuta" class="inv-slot">? EVIDÊNCIA 2</div>
        <div id="slot-equilibrio" class="inv-slot">? EVIDÊNCIA 3</div>
    </div>

<script>
    let encontrados = 0;
    const totalItens = 3;

    function coletar(idItem, nomeItem, descricao) {
        const slot = document.getElementById('slot-' + idItem);
        
        // Se já foi encontrado, não faz nada
        if (slot.classList.contains('found')) return;

        // Atualizar Inventário
        slot.classList.add('found');
        slot.innerText = '✔ ' + nomeItem;

        // Esconder o item clicável (para não clicar de novo)
        document.getElementById('item-' + idItem).style.display = 'none';

        // Mostrar Mensagem Narrativa
        const msgBox = document.getElementById('msg-box');
        msgBox.innerHTML = `<h3>${nomeItem} coletado!</h3><p>${descricao}</p>`;
        msgBox.style.display = 'block';

        encontrados++;

        // Verificar vitória
        if (encontrados === totalItens) {
            msgBox.innerHTML += `<h2>CONSENSO ESTABELECIDO!</h2><p>Você restaurou a ordem no hospital através do diálogo.</p>`;
            setTimeout(() => {
                alert("PARABÉNS! Você completou a mediação hospitalar.");
                location.reload(); // Reinicia o jogo
            }, 5000);
        } else {
            // Esconde a mensagem depois de 4 segundos
            setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
        }
    }

    // Pré-carregamento: tenta verificar se a imagem existe
    const img = new Image();
    img.src = 'hospital.png';
    img.onerror = function() {
        alert("ERRO: O arquivo 'hospital.png' não foi encontrado na mesma pasta que este arquivo HTML.");
    };
</script>

</body>
</html>
