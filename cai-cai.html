<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Celestial Coherence: Final Edition</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000 url('sky.jpeg') no-repeat center center fixed; 
            background-size: cover;
            color: #fff; font-family: 'Courier New', monospace; 
            overflow: hidden; touch-action: none; 
        }
        #ui { 
            position: absolute; top: 10px; width: 100%; 
            display: flex; justify-content: space-around; 
            pointer-events: none; z-index: 10; 
        }
        .stat-group { 
            background: rgba(0, 0, 0, 0.85); padding: 12px; 
            border: 1px solid #00ff00; border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,0,0.2);
        }
        #timer-box { font-size: 1.8em; color: #fff; text-shadow: 0 0 10px #fff; }
        
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; 
            align-items: center; justify-content: center; text-align: center; z-index: 100;
        }
        #results { 
            display: none; background: rgba(10, 10, 10, 0.95); 
            padding: 40px; border: 2px solid #00ff00; border-radius: 20px;
            max-width: 80%; line-height: 1.6;
        }
        .btn { 
            background: #00ff00; color: #000; border: none; padding: 20px 60px; 
            cursor: pointer; font-size: 1.4em; font-weight: bold; border-radius: 50px;
            margin-top: 20px; transition: 0.3s;
        }
        .btn:hover { transform: scale(1.1); background: #fff; }
        
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-group">SCORE: <span id="score">0</span></div>
    <div id="timer-box"><span id="timer">45</span>s</div>
    <div class="stat-group">D: <span id="dark-c">0</span> | L: <span id="light-c">0</span></div>
</div>

<div id="overlay">
    <div id="start-screen">
        <h1 style="color:#00ff00; font-size: 3em;">CELESTIAL COHERENCE</h1>
        <p>⚡/☁️ → SACO ESQUERDO | ⭐/🌙 → SACO DIREITO</p>
        <button class="btn" id="startBtn">CONECTAR AO NÚCLEO</button>
    </div>
    
    <div id="results">
        <h1 style="color:#00ff00;">DIAGNÓSTICO DE SESSÃO</h1>
        <div id="profile-details" style="text-align: left; margin-bottom: 20px;"></div>
        <button class="btn" onclick="location.reload()">REINICIAR</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let gameActive = false, score = 0, darkCollected = 0, lightCollected = 0, totalHits = 0, errors = 0, timeLeft = 45;
let playerX = window.innerWidth / 2, animationId, items = [], feedbacks = [];

const imgs = { moon: new Image(), rain: new Image(), star: new Image(), bolt: new Image() };
imgs.moon.src = 'crescent-moon.png'; imgs.rain.src = 'heavy-rain.png';
imgs.star.src = 'star.png'; imgs.bolt.src = 'thunder.png';

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Controles
const moveHandler = (e) => {
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    playerX = x;
};
canvas.addEventListener('mousemove', moveHandler);
canvas.addEventListener('touchmove', (e) => { moveHandler(e); e.preventDefault(); }, {passive: false});

class Item {
    constructor() {
        this.type = Math.random() > 0.5 ? 'sombrio' : 'alegre';
        this.special = Math.random() < 0.3;
        this.x = Math.random() * (canvas.width - 60) + 30;
        this.y = -50;
        this.speed = (this.special ? 8 : 5) + Math.random() * 3;
        this.size = 40; // TAMANHO PADRONIZADO
        this.img = (this.type === 'sombrio') ? (Math.random() > 0.5 ? imgs.bolt : imgs.rain) : (Math.random() > 0.5 ? imgs.star : imgs.moon);
    }
    draw() {
        ctx.save();
        if(this.special) {
            ctx.shadowBlur = 20;
            ctx.shadowColor = this.type === 'sombrio' ? "#ff0000" : "#ffff00";
        }
        ctx.drawImage(this.img, this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.restore();
    }
}

function spawn() {
    if (!gameActive) return;
    items.push(new Item());
    // Dificuldade antagônica
    if(Math.random() < 0.35) {
        setTimeout(() => { if(gameActive) items.push(new Item()); }, 200);
    }
    setTimeout(spawn, 500 + Math.random() * 500);
}

function drawSaco(x, y, color, label) {
    ctx.save();
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    
    // Desenho do Saco
    ctx.beginPath();
    ctx.moveTo(x - 40, y); // Boca esquerda
    ctx.lineTo(x + 40, y); // Boca direita
    ctx.bezierCurveTo(x + 60, y + 80, x - 60, y + 80, x - 40, y); // Fundo arredondado
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    
    ctx.fillStyle = color;
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText(label, x, y + 45);
    ctx.restore();
}

function update() {
    if (!gameActive) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const bY = canvas.height - 120;
    drawSaco(playerX - 70, bY, "#ff3333", "SOMBRIO");
    drawSaco(playerX + 70, bY, "#ffff33", "ALEGRE");

    // Processar Itens
    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += it.speed;
        it.draw();

        if (it.y > canvas.height) {
            score -= 2;
            feedbacks.push({x: it.x, y: canvas.height - 40, txt: "-2", a: 1, c: "#ff4444"});
            items.splice(i, 1);
        } else if (it.y > bY && it.y < bY + 60) {
            const distLeft = Math.abs(it.x - (playerX - 70));
            const distRight = Math.abs(it.x - (playerX + 70));
            
            if (distLeft < 50 || distRight < 50) {
                const capturedLeft = distLeft < distRight;
                const correct = (capturedLeft && it.type === 'sombrio') || (!capturedLeft && it.type === 'alegre');
                
                let p = correct ? (it.special ? 40 : 20) : -20;
                score += p;
                totalHits++;
                if(!correct) errors++;
                
                if(correct) it.type === 'sombrio' ? darkCollected++ : lightCollected++;
                
                feedbacks.push({
                    x: it.x, y: it.y, 
                    txt: (p > 0 ? "+" : "") + p, 
                    a: 1, c: correct ? "#00ff00" : "#ff0000"
                });
                items.splice(i, 1);
            }
        }
    }

    // Desenhar Feedbacks
    for (let i = feedbacks.length - 1; i >= 0; i--) {
        let f = feedbacks[i];
        ctx.save();
        ctx.globalAlpha = f.a;
        ctx.fillStyle = f.c;
        ctx.font = "bold 25px Courier New";
        ctx.fillText(f.txt, f.x, f.y);
        ctx.restore();
        f.y -= 2; f.a -= 0.02;
        if(f.a <= 0) feedbacks.splice(i, 1);
    }
    
    document.getElementById('score').innerText = score;
    document.getElementById('dark-c').innerText = darkCollected;
    document.getElementById('light-c').innerText = lightCollected;
    animationId = requestAnimationFrame(update);
}

document.getElementById('startBtn').addEventListener('click', () => {
    gameActive = true;
    document.getElementById('overlay').style.display = 'none';
    spawn(); update();
    const timerInt = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(timerInt);
            gameActive = false;
            showFinal();
        }
    }, 1000);
});

function showFinal() {
    document.getElementById('results').style.display = 'block';
    
    const diff = Math.abs(darkCollected - lightCollected);
    const total = darkCollected + lightCollected;
    const coherence = total > 0 ? (diff / total) : 0;
    const precision = totalHits > 0 ? ((totalHits - errors) / totalHits) : 0;
    
    let perfil = "";
    if (coherence > 0.7) {
        perfil = "<b>PERFIL: ESPECIALISTA DETERMINADO.</b> Suas escolhas mostram uma forte inclinação para um único polo, ignorando distrações antagônicas.";
    } else if (coherence < 0.3) {
        perfil = "<b>PERFIL: DILUÍDO / EQUILIBRISTA.</b> Você tentou processar ambos os lados igualmente, o que fragmentou sua identidade de coleta.";
    } else {
        perfil = "<b>PERFIL: EXPLORADOR VERSÁTIL.</b> Você consegue navegar entre as dualidades, mantendo uma base de dados mista.";
    }

    let precisaoMsg = precision > 0.8 ? "Sua precisão cirúrgica indica alta sincronia com o sistema." : "Sua taxa de erro sugere interferência emocional na coleta.";

    document.getElementById('profile-details').innerHTML = `
        <p><b>Score Base:</b> ${score}</p>
        <p><b>Precisão de Captura:</b> ${(precision * 100).toFixed(1)}%</p>
        <p><b>Fator de Coerência:</b> ${(coherence * 100).toFixed(1)}%</p>
        <hr style="border-color:#00ff00">
        <p>${perfil}</p>
        <p>${precisaoMsg}</p>
    `;
}
</script>
</body>
</html>
