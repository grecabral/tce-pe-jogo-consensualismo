<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rodovia do Consenso 3D - Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Bungee', cursive; }
        #ui {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around;
            color: #003366; z-index: 10; pointer-events: none;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        .stat-box { background: rgba(255, 255, 255, 0.8); padding: 10px 20px; border-radius: 15px; border: 2px solid #003366; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 51, 102, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; color: white;
            text-align: center;
        }
        #tunnel-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 2.5rem; color: #ffcc00; display: none; z-index: 200;
            text-shadow: 0 0 15px #000; text-align: center; width: 100%;
        }
        .btn { background: #ffcc00; border: none; padding: 15px 40px; font-family: 'Bungee'; cursor: pointer; border-radius: 50px; color: #003366; margin-top: 20px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stat-box">PONTOS: <span id="score">0</span></div>
    <div class="stat-box">TEMPO: <span id="timer">30</span>s</div>
</div>

<div id="tunnel-msg">VIA DO CONSENSO!</div>

<div id="overlay">
    <h1>ESTRADA DO CONSENSO 3D</h1>
    <p>Atenção à sinalização! Túneis à frente.<br>Mova o mouse ou arraste para guiar o ônibus.</p>
    <button class="btn" onclick="initGame()">INICIAR GESTÃO</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    let scene, camera, renderer, vehicle, sun;
    let score = 0, timeLeft = 30, gameActive = false;
    let stars = [], pits = [], activeTunnels = [], roadLines = [], sceneryItems = [];
    let speed = 0.9; 
    let mouseX = 0;
    let inTunnel = false;
    let chosenTunnelX = 0;

    function initGame() {
        document.getElementById('overlay').style.display = 'none';
        setupScene();
        gameActive = true;
        animate();
        startTimer();
    }

    function setupScene() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 140);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // --- ÔNIBUS GEOMÉTRICO ---
        vehicle = new THREE.Group();
        const busBody = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.2, 2), new THREE.MeshPhongMaterial({ color: 0xffcc00 }));
        const windows = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.8, 1.2), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        windows.position.y = 0.4;
        vehicle.add(busBody, windows);
        vehicle.position.y = 1.5;
        scene.add(vehicle);

        // --- ESTRADA ---
        const road = new THREE.Mesh(new THREE.PlaneGeometry(16, 2000), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        road.rotation.x = -Math.PI / 2;
        scene.add(road);

        const grass = new THREE.Mesh(new THREE.PlaneGeometry(500, 2000), new THREE.MeshPhongMaterial({ color: 0x1b5e20 }));
        grass.rotation.x = -Math.PI / 2; grass.position.y = -0.1;
        scene.add(grass);

        // Itens iniciais
        for(let i=0; i<15; i++) {
            spawnCloud(true);
            if(Math.random() > 0.5) spawnTree(Math.random() > 0.5 ? 1 : -1);
        }

        window.addEventListener('mousemove', (e) => mouseX = (e.clientX / window.innerWidth) * 2 - 1);
        window.addEventListener('touchmove', (e) => mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1);
    }

    function spawnCloud(initial) {
        const cloud = new THREE.Group();
        const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        for(let i=0; i<3; i++) {
            const part = new THREE.Mesh(new THREE.SphereGeometry(Math.random()*4 + 2, 8, 8), mat);
            part.position.set(i*3, Math.random()*2, Math.random()*2);
            cloud.add(part);
        }
        cloud.position.set(Math.random()*120 - 60, 20, initial ? Math.random()*-150 : -200);
        scene.add(cloud);
        sceneryItems.push(cloud);
    }

    function spawnRoadLine() {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 6), new THREE.MeshBasicMaterial({color: 0xffffff}));
        line.rotation.x = -Math.PI/2;
        line.position.set(0, 0.05, -180);
        scene.add(line);
        roadLines.push(line);
    }

    function spawnWarningSign() {
        const sign = new THREE.Group();
        const panel = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 0.5), new THREE.MeshPhongMaterial({color: 0x004400}));
        panel.position.set(0, 10, 0);
        const poleL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 12, 0.4), new THREE.MeshPhongMaterial({color: 0x666666}));
        poleL.position.set(-7, 6, 0);
        const poleR = poleL.clone(); poleR.position.set(7, 6, 0);

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512; canvas.height = 128;
        ctx.fillStyle = '#004400'; ctx.fillRect(0,0,512,128);
        ctx.fillStyle = 'white'; ctx.font = 'bold 26px Arial'; ctx.textAlign = 'center';
        ctx.fillText('TÚNEL CONSENSO OU', 256, 50); ctx.fillText('PUNIÇÃO A 5KM', 256, 90);
        
        const label = new THREE.Mesh(new THREE.PlaneGeometry(13, 3.5), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(canvas)}));
        label.position.set(0, 10, 0.3);
        sign.add(panel, poleL, poleR, label);
        sign.position.z = -180;
        scene.add(sign);
        sceneryItems.push(sign);
    }

    function spawnTree(xSide) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 3), new THREE.MeshPhongMaterial({color: 0x3e2723}));
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 8), new THREE.MeshPhongMaterial({color: 0x1a5e20}));
        leaves.position.y = 3.5;
        tree.add(trunk, leaves);
        tree.position.set(xSide * (14 + Math.random()*8), 1.5, -200);
        scene.add(tree);
        sceneryItems.push(tree);
    }

    function spawnTunnel() {
        const createT = (x, color, name) => {
            const g = new THREE.Group();
            const tube = new THREE.Mesh(
                new THREE.CylinderGeometry(6, 6, 90, 24, 1, true),
                new THREE.MeshPhongMaterial({ color: 0x111111, side: THREE.BackSide, emissive: color, emissiveIntensity: 0.5 })
            );
            tube.rotation.x = Math.PI/2;
            
            // Placa Individual ACIMA da entrada
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = '#000000'; ctx.fillRect(0,0,256,64);
            ctx.fillStyle = color; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
            ctx.fillText(name, 128, 45);
            
            const board = new THREE.Mesh(new THREE.BoxGeometry(8, 3, 0.5), new THREE.MeshPhongMaterial({color: 0x000000}));
            board.position.set(0, 8.5, -45);
            const label = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 2.5), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(canvas)}));
            label.position.set(0, 8.5, -44.7);
            
            g.add(tube, board, label);
            g.position.set(x, 2.5, -210);
            g.userData = { name, color, tunnelX: x };
            return g;
        };
        const t1 = createT(-5.5, 0x2ecc71, "CONSENSO");
        const t2 = createT(5.5, 0xe74c3c, "PUNIÇÃO");
        activeTunnels.push(t1, t2);
        scene.add(t1, t2);
    }

    function animate() {
        if (!gameActive) return;
        requestAnimationFrame(animate);

        const targetX = mouseX * 8.5;
        vehicle.position.x += (targetX - vehicle.position.x) * 0.1;
        vehicle.rotation.z = (vehicle.position.x - targetX) * 0.05;

        // Movimento da estrada e sinalização
        if (Math.random() < 0.15) spawnRoadLine();
        if (Math.random() < 0.01) spawnCloud(false);
        if (Math.random() < 0.04) spawnTree(Math.random() > 0.5 ? 1 : -1);
        if (!inTunnel && Math.random() < 0.05) spawnItem();

        roadLines.forEach((l, i) => { l.position.z += speed; if(l.position.z > 25) { scene.remove(l); roadLines.splice(i,1); } });
        sceneryItems.forEach((s, i) => { s.position.z += speed; if(s.position.z > 80) { scene.remove(s); sceneryItems.splice(i,1); } });

        // Túneis e Zoom
        let inside = false;
        activeTunnels.forEach((tun, i) => {
            tun.position.z += speed;
            const distZ = Math.abs(vehicle.position.z - tun.position.z);
            if (distZ < 45 && Math.abs(vehicle.position.x - tun.position.x) < 5) {
                inside = true; tun.userData.hit = true; chosenTunnelX = tun.userData.tunnelX;
            }
            if (tun.position.z > 20 && tun.userData.hit) {
                const msg = document.getElementById('tunnel-msg');
                msg.innerText = tun.userData.name === "CONSENSO" ? "CONSENSO: GESTÃO EFICIENTE! +20" : "PUNIÇÃO: RECURSO PERDIDO! -10";
                msg.style.color = tun.userData.name === "CONSENSO" ? "#2ecc71" : "#ff4444";
                msg.style.display = "block";
                score += (tun.userData.name === "CONSENSO" ? 20 : -10);
                document.getElementById('score').innerText = Math.max(0, score);
                setTimeout(() => msg.style.display = "none", 2500);
                tun.userData.hit = false;
            }
            if (tun.position.z > 150) { scene.remove(tun); activeTunnels.splice(i,1); }
        });

        if (inside) {
            if (!inTunnel) toggleEnv(true);
            camera.fov += (40 - camera.fov) * 0.1;
            camera.position.x += (chosenTunnelX - camera.position.x) * 0.1;
        } else {
            if (inTunnel) toggleEnv(false);
            camera.fov += (75 - camera.fov) * 0.1;
            camera.position.x += (0 - camera.position.x) * 0.1;
        }
        camera.updateProjectionMatrix();

        // Itens
        [...stars, ...pits].forEach((item, i) => {
            item.position.z += speed;
            if (vehicle.position.distanceTo(item.position) < 2.8) {
                if (stars.includes(item)) { score += 5; stars.splice(stars.indexOf(item), 1); }
                else { score = Math.max(0, score - 10); pits.splice(pits.indexOf(item), 1); }
                scene.remove(item);
                document.getElementById('score').innerText = score;
            }
        });

        renderer.render(scene, camera);
    }

    function toggleEnv(dark) {
        inTunnel = dark;
        scene.background.set(dark ? 0x000000 : 0x87CEEB);
        scene.fog.color.set(dark ? 0x000000 : 0x87CEEB);
        sun.intensity = dark ? 0.05 : 1.2;
    }

    function spawnItem() {
        const isStar = Math.random() > 0.5;
        const item = new THREE.Mesh(
            isStar ? new THREE.OctahedronGeometry(0.7) : new THREE.CircleGeometry(2, 32),
            new THREE.MeshPhongMaterial({ color: isStar ? 0xffcc00 : 0x111111 })
        );
        if(!isStar) { item.rotation.x = -Math.PI/2; item.scale.set(1.8, 0.8, 1); }
        item.position.set(Math.random()*14 - 7, isStar ? 1.5 : 0.05, -190);
        scene.add(item);
        (isStar ? stars : pits).push(item);
    }

    function startTimer() {
        setInterval(() => {
            if (!gameActive) return;
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft === 25 || timeLeft === 15) spawnWarningSign();
            if (timeLeft === 20 || timeLeft === 10) spawnTunnel();
            if (timeLeft <= 0) { gameActive = false; alert("Chegada! Pontuação: " + score); location.reload(); }
        }, 1000);
    }
</script>
</body>
</html>
