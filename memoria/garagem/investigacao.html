<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Investigação: Garagem de Ônibus</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; background: #000;
            font-family: 'Segoe UI', sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #111 url('bg.png') no-repeat center center;
            background-size: cover;
        }

        /* Camada de Itens - Fica abaixo da escuridão mas acima do BG */
        #items-layer {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 5;
        }

        /* O GRANDE SEGREDO: O Overlay agora recebe a máscara da lanterna */
        #dark-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            z-index: 10;
            pointer-events: none; /* Permite clicar nos itens através dele */
            
            /* Máscara da Lanterna aplicada globalmente sobre os quadrantes */
            -webkit-mask-image: radial-gradient(circle 160px at var(--x, 50%) var(--y, 50%), transparent 0%, transparent 70%, black 100%);
            mask-image: radial-gradient(circle 160px at var(--x, 50%) var(--y, 50%), transparent 0%, transparent 70%, black 100%);
        }

        .quadrant {
            background: black;
            width: 100%;
            height: 100%;
            transition: opacity 0.6s ease, background 0.4s ease;
        }

        .item {
            position: absolute;
            width: 70px; height: 70px;
            cursor: pointer;
            z-index: 20; 
            opacity: 0; /* Invisível fora da lanterna */
            transition: opacity 0.1s;
        }

        #ui {
            position: fixed; top: 20px; left: 20px;
            color: white; z-index: 100;
            background: rgba(0,0,0,0.8); padding: 15px;
            border-radius: 8px; border: 1px solid #444;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="ui">
    Consensualistas coletados: <span id="score">0</span> / 5
    <div id="msg" style="color: #ffeb3b;">Mova o mouse para iluminar a garagem</div>
</div>

<div id="game-container">
    <div id="items-layer"></div>
    <div id="dark-overlay"></div>
</div>

<script>
    const container = document.getElementById('game-container');
    const overlay = document.getElementById('dark-overlay');
    const itemsLayer = document.getElementById('items-layer');
    const scoreEl = document.getElementById('score');
    
    let score = 0;
    const quadrants = [];
    const mainParts = [0, 1, 2, 3, 4, 5, 6, 7]; // Usaremos para sorteio

    // 1. Criar os 8 quadrantes
    for (let i = 0; i < 8; i++) {
        const q = document.createElement('div');
        q.className = 'quadrant';
        overlay.appendChild(q);
        quadrants.push(q);
    }

    // Sortear quais 5 serão revelados totalmente e quais 3 serão graduais
    const shuffled = [...mainParts].sort(() => Math.random() - 0.5);
    const revelaveis = shuffled.slice(0, 5);
    const graduais = shuffled.slice(5);

    // 2. Lanterna seguindo o mouse (Funciona desde o início)
    window.addEventListener('mousemove', e => {
        const x = e.clientX;
        const y = e.clientY;
        
        overlay.style.setProperty('--x', x + 'px');
        overlay.style.setProperty('--y', y + 'px');

        // Lógica de visibilidade dos itens (aparecem ao passar a lanterna)
        document.querySelectorAll('.item').forEach(item => {
            const rect = item.getBoundingClientRect();
            const ix = rect.left + rect.width/2;
            const iy = rect.top + rect.height/2;
            const dist = Math.hypot(x - ix, y - iy);
            
            item.style.opacity = dist < 160 ? "1" : "0";
            item.style.pointerEvents = dist < 160 ? "all" : "none";
        });
    });

    // 3. Inicializar itens
    function init() {
        for(let i=1; i<=5; i++) {
            spawn(i, 'c');
            spawn(i, 't');
        }
    }

    function spawn(id, type) {
        const img = document.createElement('img');
        img.src = `${type}${id}.png`;
        img.className = 'item';
        img.dataset.type = type;
        
        img.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        img.style.top = Math.random() * (window.innerHeight - 100) + 'px';
        
        img.onclick = () => {
            if(type === 'c') {
                score++;
                // Revela um quadrante fixo definitivamente
                const targetIdx = revelaveis[score-1];
                quadrants[targetIdx].style.opacity = "0"; 

                // Clareia os 3 graduais (reduzindo o fundo preto de 1 para 0.6, 0.3, 0)
                const alpha = 1 - (score * 0.2); // Redução gradual da opacidade
                graduais.forEach(idx => {
                    quadrants[idx].style.background = `rgba(0,0,0,${Math.max(0, alpha)})`;
                });

                img.remove();
            } else {
                // Item Tradicional: Apaga o último quadrante revelado
                if (score > 0) {
                    const targetIdx = revelaveis[score-1];
                    quadrants[targetIdx].style.opacity = "1";
                    score--;
                    
                    // Escurece os graduais novamente
                    const alpha = 1 - (score * 0.2);
                    graduais.forEach(idx => {
                        quadrants[idx].style.background = `rgba(0,0,0,${Math.min(1, alpha)})`;
                    });
                }
            }
            scoreEl.innerText = score;
            if(score >= 5) win();
        };
        itemsLayer.appendChild(img);
    }

    function win() {
        overlay.style.display = 'none';
        document.getElementById('msg').innerText = "GARAGEM INVESTIGADA COM SUCESSO!";
        document.getElementById('msg').style.color = "#4caf50";
    }

    init();
</script>

</body>
</html>
